<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuộc Đua Vịt Ngẫu Nhiên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🦆 Cuộc Đua sòng bài Vịt 🦆</h1>
        
        <div class="setup-box">
            <textarea id="nameInput" placeholder="Nhập tên các đấu thủ (mỗi dòng một tên)..."></textarea>
            <button id="startBtn">Bắt Đầu Đua!</button>
        </div>

        <div class="track" id="track">
            <div class="finish-line">ĐÍCH</div>
        </div>

        <div id="winnerAnnounce" class="winner-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
